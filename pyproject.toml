[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spain-libraries-mcp"
version = "0.2.1"
description = "MCP server for searching books and holdings across Spanish libraries (Z39.50 / SRU)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
spain-libraries-mcp = "spain_libraries_mcp.server:main"
spain-libraries-update-municipalities = "spain_libraries_mcp.updater:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spain_libraries_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
